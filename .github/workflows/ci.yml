name: CI

# Real CI runs on main, on version (hito) branches and on pull requests. A push to a temporary rehearsal/** branch
# runs the same jobs in rehearsal mode: a failing job is recorded in a verdict artifact instead of turning the run
# red, and nothing is deployed. Work reaches main or a hito branch only after its rehearsal passed.
on:
  push:
    branches: [main, 'v[0-9]*', 'rehearsal/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this ref to aklabs-store.web.app (production) after the checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDUSA_DISABLE_TELEMETRY: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  REHEARSAL: ${{ startsWith(github.ref, 'refs/heads/rehearsal/') }}

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/rehearsal/') }}
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: store/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: store/.nvmrc
          cache: pnpm
          cache-dependency-path: store/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Storefront
        run: pnpm --dir apps/storefront exec tsc --noEmit -p .

      # Runs without the types Medusa generates in .medusa/types during
      # `medusa develop`, so code must not depend on them to compile.
      - name: Backend
        run: pnpm --dir apps/backend exec tsc --noEmit -p .

      - name: Record rehearsal verdict
        if: ${{ always() && env.REHEARSAL == 'true' }}
        working-directory: .
        run: |
          mkdir -p .tmp/verdict
          printf '{"sha":"%s","job":"%s","status":"%s"}\n' "${{ github.sha }}" "${{ github.job }}" "${{ job.status }}" > .tmp/verdict/verdict.json
          cat .tmp/verdict/verdict.json
      - name: Upload rehearsal verdict
        if: ${{ always() && env.REHEARSAL == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-verdict-${{ github.job }}
          path: .tmp/verdict/verdict.json

  site:
    name: Static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/rehearsal/') }}
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: store/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: store/.nvmrc
          cache: pnpm
          cache-dependency-path: store/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The static export (no server, no Medusa, no secrets) that Firebase Hosting serves.
      - name: Build the static export
        run: pnpm --dir apps/storefront run build:site

      # Page checks against the exported files: routes, size budget, accessibility (axe) and the purchase flow.
      - name: Check the site
        run: pnpm --dir apps/storefront run check:site

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: store/apps/storefront/out
          retention-days: 7

      - name: Record rehearsal verdict
        if: ${{ always() && env.REHEARSAL == 'true' }}
        working-directory: .
        run: |
          mkdir -p .tmp/verdict
          printf '{"sha":"%s","job":"%s","status":"%s"}\n' "${{ github.sha }}" "${{ github.job }}" "${{ job.status }}" > .tmp/verdict/verdict.json
          cat .tmp/verdict/verdict.json
      - name: Upload rehearsal verdict
        if: ${{ always() && env.REHEARSAL == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-verdict-${{ github.job }}
          path: .tmp/verdict/verdict.json

  deploy:
    name: Deploy to aklabs-store.web.app
    needs: [typecheck, site]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: store/apps/storefront/out
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKLABS_STORE }}
          projectId: aklabs-store
          channelId: live

  preview:
    name: Preview for the pull request
    needs: [typecheck, site]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: store/apps/storefront/out
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKLABS_STORE }}
          projectId: aklabs-store
          expires: 2d
